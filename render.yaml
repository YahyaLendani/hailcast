# Render blueprint: one free web service running the API and the dashboard.
# No database or Redis is provisioned; the app uses SQLite and its in-memory queue
# and reseeds the sample data on every start, so nothing needs to persist.
services:
  - type: web
    name: hailcast
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/info
    # Deploy only after the GitHub Actions checks on master pass.
    autoDeployTrigger: checksPass
    envVars:
      # Locks the upload endpoints on the public demo. Render generates the value;
      # read it in the service's Environment tab if you need to upload data.
      - key: API_KEY
        generateValue: true
