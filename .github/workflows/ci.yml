name: Hailcast CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint Code
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Generate synthetic dataset
        run: |
          python backend/app/data/download_sample.py

      - name: Run tests (pipeline, deduplication, failure handling, filters, leakage)
        run: |
          python -m pytest -q

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Config
        run: |
          docker compose config

