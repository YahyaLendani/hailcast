name: Hailcast CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint Code
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Generate synthetic dataset
        run: |
          python backend/app/data/download_sample.py

      - name: Run tests (pipeline, deduplication, failure handling, filters, leakage)
        run: |
          python -m pytest -q

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Config
        run: |
          docker compose config -q

      - name: Build the backend image
        run: docker build -t hailcast-backend ./backend

      - name: Start the container and check that it serves
        run: |
          docker run -d --name hailcast -e PORT=8080 -e API_KEY=ci-key -p 8080:8080 hailcast-backend
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/api/v1/health/ > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/v1/health/ > /dev/null
          curl -fsS http://localhost:8080/ | grep -q "Hailcast"
          curl -fsS "http://localhost:8080/api/v1/analytics/demand-series?hours=24" | grep -q "trip_count"
          # Uploads must be refused without the key and accepted with it
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://localhost:8080/api/v1/ingest/seed-sample?sample_size=10')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-API-Key: ci-key' 'http://localhost:8080/api/v1/ingest/seed-sample?sample_size=10')" = "200"

      - name: Container logs
        if: always()
        run: docker logs hailcast 2>&1 | tail -40

