name: Keep demo awake

# Requests the hosted demo every 10 minutes and fails if it does not answer, so an
# outage shows up as a failed run. It does nothing until the repository variable
# DEMO_URL is set (Settings, Secrets and variables, Actions, Variables), for example
# https://hailcast.duckdns.org

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      - name: Ping the demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: curl -fsS --max-time 90 --retry 2 "${DEMO_URL%/}/api/info"
