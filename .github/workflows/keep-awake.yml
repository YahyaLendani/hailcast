name: Keep demo awake

# Free hosting plans put the app to sleep after about 15 idle minutes, which makes
# the first visit slow. This pings the hosted demo so it stays warm.
# It does nothing until the repository variable DEMO_URL is set
# (Settings, Secrets and variables, Actions, Variables), for example
# https://hailcast.onrender.com

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_URL != '' }}
    steps:
      - name: Ping the demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: curl -fsS --max-time 90 --retry 2 "${DEMO_URL%/}/api/info"
