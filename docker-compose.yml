version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowsight-postgres
    restart: always
    environment:
      POSTGRES_USER: flowsight_user
      POSTGRES_PASSWORD: flowsight_password
      POSTGRES_DB: flowsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowsight_user -d flowsight_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowsight-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowsight-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://flowsight_user:flowsight_password@postgres:5432/flowsight_db
      - SYNC_DATABASE_URL=postgresql://flowsight_user:flowsight_password@postgres:5432/flowsight_db
      - REDIS_URL=redis://redis:6379/0
      - REPLAY_SPEED_MULTIPLIER=10.0
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowsight-worker
    restart: always
    command: python -m app.services.streaming_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://flowsight_user:flowsight_password@postgres:5432/flowsight_db
      - SYNC_DATABASE_URL=postgresql://flowsight_user:flowsight_password@postgres:5432/flowsight_db
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowsight-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/stream

volumes:
  postgres_data:
  redis_data:

